[package]
name = "now-playing"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
fontdue = "0.9"
sdl2 = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }

[profile.release]
strip = true
