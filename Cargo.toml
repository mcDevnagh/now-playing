[workspace]
members = ["app", "core", "switcher"]
exclude = ["spikes"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
now-playing-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }

[profile.release]
strip = true
