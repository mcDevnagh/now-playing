# now-playing-switcher's config. Copy it to
# ~/.config/now-playing/switcher.toml and fill in your own values.
#
# The switcher runs beside Kodi, started by htpc/kodi-steam. Each table
# follows one player; leave a table out to not follow it. With
# `quiet_others = true`, the player starting quiets the others, so two never
# play over each other: Kodi is paused, and this machine's Snapcast client is
# muted, its music playing on elsewhere. UxPlay is never touched. Snapcast
# starting always unmutes the client, so pausing and playing the music brings
# it back here.

# Kodi starts or resumes playback.
[kodi]
# Kodi starting mutes this machine's Snapcast client.
quiet_others = true
# Kodi's JSON-RPC TCP port. This is the default.
address = "127.0.0.1:9090"

# Run Now Playing as Kodi's screensaver. Set Kodi's own screensaver to
# "Black", with its idle time, in each profile: the switcher runs this
# command while Kodi's screensaver is up, and stops it when Kodi's stops,
# as on playback or a phone's share. The command runs with the switcher's
# environment, which kodi-steam's makes part of Kodi's Steam app, so its
# window shows over Kodi's. With --screensaver, any key but the media keys
# closes Now Playing, and the switcher then wakes Kodi. Leave the table out
# to leave Kodi's screensaver alone.
[kodi.screensaver]
command = ["/home/deck/.local/bin/now-playing", "--screensaver",
           "--server", "snapserver:1705"]

# A profile with a table here loads another as Kodi's screensaver starts in
# it, instead of running the command, so a locked profile is left after its
# idle time while the other, unlocked, stays for Share to Kodi to play to.
# The other's own screensaver then runs the command after its idle time.
# Loading a profile stops playback; a paused movie keeps its resume point.
# Profiles are named as Kodi shows them. Needs [kodi.screensaver].
[kodi.profiles."Master user"]
switch_to = "Guest"

# Music starts on this machine's Snapcast client.
[snapcast]
# Snapcast starting pauses Kodi.
quiet_others = true
# snapserver's JSON-RPC address. Required.
server = "snapserver:1705"
# The Snapcast client to follow, by id or host name. Defaults to this
# machine's hostname.
# client = "htpc"

# A device starts mirroring its screen to UxPlay. Audio-only AirPlay opens no
# window, so it doesn't count. UxPlay's window opens on $DISPLAY, which
# kodi-steam passes down.
[uxplay]
# A cast pauses Kodi and mutes this machine's Snapcast client.
quiet_others = true
# While a device mirrors, the remote isn't touching Kodi, so Kodi would go
# idle and start its screensaver over the mirror. This sends Kodi a no-op
# every 30 s meanwhile, which holds it off. Needs a [kodi] table. This is
# the default.
keep_kodi_awake = true
# The WM_CLASS class of UxPlay's video window, which it opens while a device
# mirrors and closes when it stops. This is the default.
# window_class = "GStreamer"
